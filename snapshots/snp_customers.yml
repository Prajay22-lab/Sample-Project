version: 2

snapshots:
  - name: snp_customers
    description: Type-2 history of stg_customers, tracked via updated_date.
    columns:
      - name: customer_id
        description: Natural key of the customer.
        tests:
          - not_null
      - name: dbt_valid_from
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [customer_id, dbt_valid_from]
