    database: DBT_DEV
    schema: RAW
    config:
      loaded_at_field: updated_date
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 48, period: hour}
    tables:
      - name: customers
      - name: accounts
      - name: opportunities
