version: 2

models:
  - name: stg_customers
    description: >
      **Grain**: One row per Salesforce customer.

      Staging model for Salesforce customer records. Cleans text fields
      (trim/case normalization) from the raw CUSTOMERS source table.
      Performs no filtering or aggregation, so row count matches the source 1:1.
    config:
      meta:
        owner: analytics-team
        tier: staging
        pii: true
    columns:
      - name: customer_id
        description: >
          Unique identifier for a customer. Primary key of this model.
          Source is Salesforce customer_id, passed through unchanged.
        tests:
          - not_null
          - unique
      - name: first_name
        description: >
          Customer's first name, trimmed and uppercased.
          Source is Salesforce first_name.
      - name: last_name
        description: >
          Customer's last name, trimmed and uppercased.
          Source is Salesforce last_name.
      - name: email
        description: >
          Customer email address, lowercased and trimmed.
          Source is Salesforce email. Not validated for format.
        tests:
          - not_null
      - name: country
        description: >
          Customer country, trimmed. Free text; not standardized against a
          fixed country list. Source is Salesforce country.
      - name: customer_status
        description: >
          Lifecycle status of the customer, uppercased via the clean_text macro.
          ACTIVE means a currently engaged customer, INACTIVE means churned
          or dormant, PROSPECT means not yet a paying customer.
          Source is Salesforce customer_status.
        tests:
          - accepted_values:
