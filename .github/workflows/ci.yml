name: dbt CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  dbt-ci:

    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake

      - name: Install dbt packages
        run: dbt deps

      - name: Check Snowflake connection
        run: dbt debug --profiles-dir .github/dbt

      - name: Parse dbt project
        run: dbt parse --profiles-dir .github/dbt

      - name: Compile dbt project
        run: dbt compile --profiles-dir .github/dbt

      - name: Run dbt tests
        run: dbt test --profiles-dir .github/dbt